<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boson Motor — Owner Portal Login</title>
  <script src="/env.js" onerror="this.remove()"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1e293b;
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .login-header {
      background-color: var(--navy);
      padding: 32px 24px 24px 24px;
      text-align: center;
      color: #ffffff;
    }

    .login-header img {
      max-height: 48px;
      width: auto;
      margin-bottom: 12px;
    }

    .login-header p {
      margin: 6px 0 0 0;
      color: #94a3b8;
      font-size: 13px;
    }

    .login-body {
      padding: 32px 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      transition: all 0.15s ease;
      background-color: #f8fafc;
    }

    .form-group input:focus {
      border-color: var(--accent);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .error-banner {
      display: none;
      background-color: #fee2e2;
      border: 1px solid #fecaca;
      color: var(--danger);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      align-items: center;
      gap: 8px;
    }

    .error-banner.visible {
      display: flex;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease;
    }

    .btn-login:hover {
      background-color: #1d4ed8;
    }

    .btn-login:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    .footer-links {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
    }

    .footer-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <img src="/Boson_logo.png?v=20260826" alt="Boson Motor" style="height: 72px; width: auto; max-width: 280px; object-fit: contain; display: block; margin: 0 auto 14px auto;">
      <p>Owner Dashboard &mdash; Authentication</p>
    </div>

    <div class="login-body">
      <div id="error-box" class="error-banner">
        <span>⚠️</span>
        <span id="error-message">Invalid username or password.</span>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter owner username"
               autofocus autocomplete="username"
               onkeydown="if(event.key==='Enter'){document.getElementById('password').focus();}">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter owner password"
               autocomplete="current-password"
               onkeydown="if(event.key==='Enter'){doLogin();}">
      </div>

      <button type="button" id="submit-btn" class="btn-login" onclick="doLogin()">
        <span id="btn-text">Sign In to Owner Portal</span>
        <span id="login-arrow">&rarr;</span>
      </button>
    </div>
  </div>

  <div class="footer-links">
    <a href="/">
      &larr; Back to Customer Dashboard (Public)
    </a>
  </div>

  <script>
    // ── Determine where to redirect after successful login ──────────────────
    var _nextUrl = (function() {
      var params = new URLSearchParams(window.location.search);
      var raw = params.get('next') || '';
      // Normalize /owner and /admin aliases to the actual file
      if (!raw || raw === '/owner' || raw === '/admin') {
        return '/vehicle_mission_report-4.html';
      }
      // Safety: only allow relative redirects (no open redirect)
      if (raw.charAt(0) !== '/') return '/vehicle_mission_report-4.html';
      return raw;
    })();

    // ── Auto-redirect if a valid session already exists ──────────────────────
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get('logout') === '1') {
          try { localStorage.removeItem('bvmc_owner_session'); } catch (e) {}
          try { sessionStorage.removeItem('bvmc_owner_session'); } catch (e) {}
          return;
        }
        var s = localStorage.getItem('bvmc_owner_session') || sessionStorage.getItem('bvmc_owner_session');
        if (s) {
          var parsed = JSON.parse(s);
          if (parsed && (parsed.username || parsed.user)) {
            window.location.replace(_nextUrl);
          }
        }
      } catch (e) { /* ignore */ }
    })();

    // ── Main login function — called by button onclick and Enter key ─────────
    function doLogin() {
      var username = (document.getElementById('username').value || '').trim();
      var password = document.getElementById('password').value || '';
      var errorBox = document.getElementById('error-box');
      var submitBtn = document.getElementById('submit-btn');
      var btnText = document.getElementById('btn-text');

      // Clear any previous error
      errorBox.classList.remove('visible');

      if (!username || !password) {
        document.getElementById('error-message').textContent = 'Please enter both username and password.';
        errorBox.classList.add('visible');
        return;
      }

      // ── Built-in owner credentials (works fully offline) ──────────────────
      if ((username === 'admin' || username === 'owner') && password === 'boson2026') {
        submitBtn.disabled = true;
        btnText.textContent = 'Redirecting…';

        var session = JSON.stringify({
          username: username,
          role: 'owner',
          authenticated_at: new Date().toISOString()
        });

        // Write to both storages so whichever the dashboard reads works
        try { localStorage.setItem('bvmc_owner_session', session); } catch (e) {}
        try { sessionStorage.setItem('bvmc_owner_session', session); } catch (e) {}

        // Small delay so the browser has a chance to flush storage before navigating
        setTimeout(function() {
          window.location.href = _nextUrl;
        }, 50);
        return;
      }

      // ── Wrong credentials ─────────────────────────────────────────────────
      document.getElementById('error-message').textContent = 'Invalid username or password.';
      errorBox.classList.add('visible');
    }
  </script>

</body>
</html>
