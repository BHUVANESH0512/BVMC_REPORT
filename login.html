<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boson Motor — Owner Portal Login</title>
  <script src="/env.js" onerror="this.remove()"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1e293b;
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .login-header {
      background-color: var(--navy);
      color: #ffffff;
      padding: 28px 24px;
      text-align: center;
      border-bottom: 4px solid var(--accent);
    }

    .login-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .login-header p {
      font-size: 13px;
      color: #94a3b8;
    }

    .login-body {
      padding: 28px 24px 24px 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      background-color: #ffffff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .error-banner {
      background-color: #fee2e2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .btn-login {
      width: 100%;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.15s ease, transform 0.05s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      background-color: var(--accent-hover);
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    .footer-links {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
    }

    .footer-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <img src="/Boson_logo.png?v=20260826" alt="Boson Motor" style="height: 72px; width: auto; max-width: 280px; object-fit: contain; display: block; margin: 0 auto 14px auto;">
      <p>Owner Dashboard &mdash; Authentication</p>
    </div>

    <div class="login-body">
      <div id="error-box" class="error-banner">
        <span>⚠️</span>
        <span id="error-message">Invalid username or password.</span>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter owner username" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter owner password" required autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn" class="btn-login">
          <span>Sign In to Owner Portal</span>
          <span id="login-arrow">&rarr;</span>
        </button>
      </form>
    </div>
  </div>

  <div class="footer-links">
    <a href="/">
      &larr; Back to Customer Dashboard (Public)
    </a>
  </div>

  <script type="module">
    import { supabase, isSupabaseConfigured } from './js/supabaseClient.js';

    window.handleLogin = async function(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('error-box');
      const errorMsg = document.getElementById('error-message');
      const submitBtn = document.getElementById('submit-btn');

      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Authenticating...';

      const urlParams = new URLSearchParams(window.location.search);
      const nextUrl = urlParams.get('next') || '/vehicle_mission_report-4.html';

      try {
        let authSuccess = false;

        // 1. Try Supabase Auth if configured
        if (isSupabaseConfigured()) {
          const email = username.includes('@') ? username : `${username}@bosonmotors.com`;
          const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (!error && data?.session) {
            authSuccess = true;
            localStorage.setItem('bvmc_owner_session', JSON.stringify({
              user: data.user,
              timestamp: Date.now()
            }));
          }
        }

        // 2. Default credentials fallback (admin / boson2026)
        if (!authSuccess && username === 'admin' && password === 'boson2026') {
          authSuccess = true;
          localStorage.setItem('bvmc_owner_session', JSON.stringify({
            username: 'admin',
            role: 'owner',
            timestamp: Date.now()
          }));
        }

        if (authSuccess) {
          window.location.href = nextUrl;
        } else {
          errorMsg.textContent = 'Invalid username or password.';
          errorBox.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In to Owner Portal</span> &rarr;';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorMsg.textContent = 'Authentication error. Please try again.';
        errorBox.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In to Owner Portal</span> &rarr;';
      }
    };
  </script>

</body>
</html>
