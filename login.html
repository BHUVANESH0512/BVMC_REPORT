<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boson Motor — Owner Portal Login</title>
  <script src="/env.js" onerror="this.remove()"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1e293b;
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .login-header {
      background-color: var(--navy);
      padding: 32px 24px 24px 24px;
      text-align: center;
      color: #ffffff;
    }

    .login-header img {
      max-height: 48px;
      width: auto;
      margin-bottom: 12px;
    }

    .login-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .login-header p {
      margin: 6px 0 0 0;
      color: #94a3b8;
      font-size: 13px;
    }

    .login-body {
      padding: 32px 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      transition: all 0.15s ease;
      background-color: #f8fafc;
    }

    .form-group input:focus {
      border-color: var(--accent);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .error-banner {
      display: none;
      background-color: #fee2e2;
      border: 1px solid #fecaca;
      color: var(--danger);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease;
    }

    .btn-login:hover {
      background-color: #1d4ed8;
    }

    .btn-login:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    .footer-links {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
    }

    .footer-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <img src="/Boson_logo.png?v=20260826" alt="Boson Motor" style="height: 72px; width: auto; max-width: 280px; object-fit: contain; display: block; margin: 0 auto 14px auto;">
      <p>Owner Dashboard &mdash; Authentication</p>
    </div>

    <div class="login-body">
      <div id="error-box" class="error-banner" style="display: none;">
        <span>⚠️</span>
        <span id="error-message">Invalid username or password.</span>
      </div>

      <form id="login-form" action="javascript:void(0);" onsubmit="return false;" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter owner username" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter owner password" required autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn" class="btn-login">
          <span id="btn-text">Sign In to Owner Portal</span>
          <span id="login-arrow">&rarr;</span>
        </button>
      </form>
    </div>
  </div>

  <div class="footer-links">
    <a href="/">
      &larr; Back to Customer Dashboard (Public)
    </a>
  </div>

  <script>
    (function() {
      // Determine target redirect URL
      const urlParams = new URLSearchParams(window.location.search);
      const rawNext = urlParams.get('next') || '/vehicle_mission_report-4.html';
      const nextUrl = (rawNext === '/owner' || rawNext === '/admin') ? '/vehicle_mission_report-4.html' : rawNext;

      // Auto-redirect if already authenticated
      try {
        const existingSession = localStorage.getItem('bvmc_owner_session');
        if (existingSession) {
          const parsed = JSON.parse(existingSession);
          if (parsed && (parsed.username || parsed.user)) {
            window.location.replace(nextUrl);
            return;
          }
        }
      } catch (e) {
        // Ignore session parse error
      }

      const form = document.getElementById('login-form');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const errorBox = document.getElementById('error-box');
      const errorMsg = document.getElementById('error-message');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');

      form.addEventListener('submit', async function(event) {
        event.preventDefault();
        event.stopPropagation();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        errorBox.style.display = 'none';
        submitBtn.disabled = true;
        btnText.textContent = 'Authenticating...';

        // 1. Direct validation for built-in credentials (instant & offline safe)
        if ((username === 'admin' || username === 'owner') && password === 'boson2026') {
          try {
            localStorage.setItem('bvmc_owner_session', JSON.stringify({
              username: username,
              role: 'owner',
              authenticated_at: new Date().toISOString()
            }));
          } catch (storageErr) {
            console.warn('LocalStorage error:', storageErr);
          }
          window.location.replace(nextUrl);
          return;
        }

        // 2. Fallback to Supabase Auth if credentials differ from default
        try {
          const supaModule = await import('./js/supabaseClient.js');
          if (supaModule && supaModule.isSupabaseConfigured()) {
            const email = username.includes('@') ? username : `${username}@bosonmotors.com`;
            const { data, error } = await supaModule.supabase.auth.signInWithPassword({
              email: email,
              password: password
            });

            if (!error && data?.session) {
              localStorage.setItem('bvmc_owner_session', JSON.stringify({
                user: data.user.email,
                token: data.session.access_token,
                authenticated_at: new Date().toISOString()
              }));
              window.location.replace(nextUrl);
              return;
            }
          }
        } catch (supaErr) {
          console.warn('Supabase Auth error:', supaErr);
        }

        // 3. If neither matched, display error without reloading
        errorMsg.textContent = 'Invalid username or password.';
        errorBox.style.display = 'flex';
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In to Owner Portal';
      });
    })();
  </script>

</body>
</html>
